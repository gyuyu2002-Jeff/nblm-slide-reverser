<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- 圓角外框細微邊界 -->
    <rect id="frame" x="4" y="4" width="120" height="120" rx="26" />
  </defs>

  <!-- 1. 溫暖燕麥白質感畫布底層 -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="#F8F6F1" stroke="#D9CEC2" stroke-width="2" />

  <!-- 2. 後層：乾燥灰粉色票投影片 (Rose Clay #C8A7A3)，微逆時針傾斜 6 度 -->
  <g transform="rotate(-6 56 60)">
    <rect x="22" y="26" width="66" height="46" rx="8" fill="#C8A7A3" opacity="0.9" />
    <!-- 象徵版型結構的留白小區塊 -->
    <rect x="28" y="32" width="22" height="14" rx="3" fill="#FFFFFF" opacity="0.8" />
    <circle cx="62" cy="39" r="3.5" fill="#FFFFFF" opacity="0.75" />
    <rect x="28" y="51" width="44" height="4" rx="2" fill="#FFFFFF" opacity="0.5" />
    <rect x="28" y="58" width="30" height="4" rx="2" fill="#FFFFFF" opacity="0.5" />
  </g>

  <!-- 3. 中層：燕麥暖駝過渡層 (Oat Taupe #B5A392) -->
  <rect x="28" y="36" width="68" height="48" rx="9" fill="#B5A392" opacity="0.95" />
  <rect x="35" y="43" width="18" height="34" rx="3" fill="#FAF8F5" opacity="0.75" />
  <rect x="58" y="43" width="30" height="15" rx="3" fill="#FAF8F5" opacity="0.45" />
  <rect x="58" y="62" width="30" height="15" rx="3" fill="#FAF8F5" opacity="0.3" />

  <!-- 4. 前層主體：鼠尾草綠 (Sage #768A7A) 16:9 投影片拓撲畫布 -->
  <rect x="34" y="44" width="76" height="54" rx="10" fill="#768A7A" stroke="#FAF8F5" stroke-width="2.5" />

  <!-- 5. 逆向工程幾何拓撲 (黃金分割左主欄 + 右雙色卡 + 象徵 NotebookLM 的智慧引導節點) -->
  <rect x="42" y="52" width="24" height="38" rx="4" fill="#FAF8F5" />
  <!-- 左主欄內的細節線條 -->
  <rect x="46" y="57" width="16" height="4" rx="2" fill="#768A7A" opacity="0.85" />
  <rect x="46" y="64" width="16" height="3" rx="1.5" fill="#C8A7A3" />
  <rect x="46" y="70" width="11" height="3" rx="1.5" fill="#B5A392" />
  <circle cx="54" cy="81" r="3.5" fill="#FFE382" />

  <!-- 右側上下卡片 -->
  <rect x="71" y="52" width="31" height="17" rx="4" fill="#FAF8F5" opacity="0.85" />
  <rect x="75" y="57" width="14" height="3" rx="1.5" fill="#4E6152" />
  <rect x="75" y="62" width="22" height="2.5" rx="1.25" fill="#968E86" opacity="0.6" />

  <rect x="71" y="73" width="31" height="17" rx="4" fill="#FAF8F5" opacity="0.5" />
  <rect x="75" y="78" width="20" height="3" rx="1.5" fill="#8F6561" />
  <rect x="75" y="83" width="15" height="2.5" rx="1.25" fill="#968E86" opacity="0.6" />
</svg>
