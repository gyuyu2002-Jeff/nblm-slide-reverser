<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <!-- 圓角基底：莫蘭迪粉霧暖白 (#FAF8F5) + 暖駝細邊 (#D9CEC2) -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#FAF8F5" stroke="#D9CEC2" stroke-width="3.5" />

  <!-- 後層：乾燥灰粉色票卡 (#C8A7A3，微傾 -7 度) -->
  <g transform="rotate(-7 54 58)">
    <rect x="20" y="26" width="68" height="48" rx="9.5" fill="#C8A7A3" />
    <circle cx="31.5" cy="37.5" r="3.5" fill="#FAF8F5" opacity="0.88" />
  </g>

  <!-- 中層：燕麥暖駝過渡色票卡 (#B5A392) -->
  <rect x="28" y="33" width="70" height="49" rx="9.5" fill="#B5A392" opacity="0.92" />

  <!-- 前層：鼠尾草綠 16:9 簡報構圖網格卡 (#768A7A) -->
  <rect x="33" y="41" width="74" height="54" rx="10.5" fill="#768A7A" stroke="#FAF8F5" stroke-width="3" />

  <!-- 內部黃金分割版型區塊 (左主欄 + 右雙層卡片) -->
  <rect x="41.5" y="49.5" width="23" height="37" rx="3.5" fill="#FAF8F5" fill-opacity="0.95" />
  <rect x="69.5" y="49.5" width="29" height="16" rx="3" fill="#FAF8F5" fill-opacity="0.52" />
  <rect x="69.5" y="70.5" width="29" height="16" rx="3" fill="#FAF8F5" fill-opacity="0.32" />
</svg>
