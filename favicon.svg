<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- 圓角容器微光漸層背景 -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1C23" />
      <stop offset="50%" stop-color="#101115" />
      <stop offset="100%" stop-color="#090A0D" />
    </linearGradient>

    <!-- 暖金色至微光白銀線條漸層 -->
    <linearGradient id="glow-line" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="30%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- 柔和微光濾鏡 -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle 圓角基底 -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg-grad)" stroke="#2B2F3B" stroke-width="2" />

  <!-- 16:9 外輪廓框架 (微光發光) -->
  <g filter="url(#soft-glow)">
    <!-- 雙層精密切割外框 -->
    <rect x="22" y="36" width="84" height="56" rx="4" fill="none" stroke="url(#glow-line)" stroke-width="2.6" />
    <rect x="25.5" y="39.5" width="77" height="49" rx="2" fill="none" stroke="#FDE68A" stroke-width="0.8" opacity="0.4" />

    <!-- 內部黃金比例版型拓撲分割 (4大模組版位) -->
    <!-- 左側主版位 (Hero 欄位) -->
    <rect x="29" y="43" width="22" height="42" rx="1.5" fill="#FDE68A" fill-opacity="0.08" stroke="url(#glow-line)" stroke-width="1.8" />
    
    <!-- 中間雙層垂直版位 -->
    <rect x="54" y="43" width="16" height="19.5" rx="1.5" fill="#FDE68A" fill-opacity="0.08" stroke="url(#glow-line)" stroke-width="1.8" />
    <rect x="54" y="65.5" width="16" height="19.5" rx="1.5" fill="#FDE68A" fill-opacity="0.08" stroke="url(#glow-line)" stroke-width="1.8" />

    <!-- 右側對稱版位 (上下分割) -->
    <rect x="73" y="43" width="26" height="19.5" rx="1.5" fill="#FDE68A" fill-opacity="0.08" stroke="url(#glow-line)" stroke-width="1.8" />
    <rect x="73" y="65.5" width="26" height="19.5" rx="1.5" fill="#FDE68A" fill-opacity="0.08" stroke="url(#glow-line)" stroke-width="1.8" />
  </g>
</svg>
